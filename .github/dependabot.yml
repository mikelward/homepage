version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      vite:
        patterns:
          - vite
          - "@vitejs/*"
          - vite-plugin-*
        update-types:
          - minor
          - patch
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
          - eslint-plugin-*
          - typescript-eslint
          - globals
        update-types:
          - minor
          - patch
      testing:
        patterns:
          - vitest
          - "@vitest/*"
          - "@testing-library/*"
          - happy-dom
        update-types:
          - minor
          - patch
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
        update-types:
          - minor
          - patch
      firebase:
        patterns:
          - firebase
        update-types:
          - minor
          - patch
      workbox:
        patterns:
          - workbox-*
        update-types:
          - minor
          - patch
      typescript:
        patterns:
          - typescript
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

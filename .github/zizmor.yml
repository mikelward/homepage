# Policy for zizmor; the advisory workflow beside this file runs it.
#
# The defaults demand hash pins everywhere and refuse pull_request_target
# outright. Both collide with decisions made deliberately across this
# fleet of repos, so the exceptions live here, scoped as narrowly as the
# tool allows.
rules:
  unpinned-uses:
    config:
      policies:
        # `@main` IS the release for these sibling actions: this repo tracks
        # them deliberately, there is no release step on their side, and a
        # pin would be a thing to bump here on every one of their merges.
        # Enumerated by name, not `mikelward/*` — owner-wide would also
        # excuse a future workflow pulling any sibling at a mutable ref, and
        # each exemption should be a decision somebody made.
        "mikelward/codex-review": ref-pin
        "mikelward/lanes": ref-pin
        # Official actions may pin to a tag, as every workflow here does.
        # Hash-pinning them instead is a deliberate open question, tracked
        # the same way mikelward/codex-review tracks it for itself.
        "actions/*": ref-pin
        # Everything else must pin to a hash.
        "*": hash-pin
  adhoc-packages:
    # npm-update.yml's own AGENTS.md section ("The npm floor is not a
    # dependency") explains why this exists: the job checks the runner's
    # npm against package.json's engines.npm floor and installs a newer
    # one, --ignore-scripts, so .npmrc's min-release-age cooldown is
    # actually honored. That's the point of the line, not an accident to
    # route around a lockfile for.
    ignore:
      - npm-update.yml:109
  dangerous-triggers:
    # codex-review.yml carries pull_request_target and workflow_run
    # deliberately, and is byte-for-byte the same centrally-managed file
    # every sibling repo in this fleet runs unmodified (see its own header
    # comment) -- it never checks out or executes pull request code with
    # the elevated token; its only job step calls mikelward/codex-review@main
    # as an external action, and permissions here are read-only plus
    # statuses: write. There is no codex-review-check.yml in this repo (no
    # consumer-side check to except alongside it).
    ignore:
      - codex-review.yml
